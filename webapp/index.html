    <!-- Polyfills for the iOS app's web view, which runs on iOS 9 and is
         missing fetch, URLSearchParams and a few other newer APIs. Also
         reports uncaught errors to the phone, so a blank page is diagnosable.
         Deferred, like the app's own script: both run after the document has
         been parsed, in the order they appear here, so the polyfills are
         always installed before the app looks for them. -->
    <script defer src="./legacy-polyfills.js"></script>
